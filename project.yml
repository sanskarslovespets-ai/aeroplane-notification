name: MeetingFly
options:
  bundleIdPrefix: com.meetingfly
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MeetingFly:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MeetingFly
        excludes:
          - "Resources/Info.plist"
          - "Resources/MeetingFly.entitlements"
    info:
      path: MeetingFly/Resources/Info.plist
      properties:
        CFBundleDisplayName: MeetingFly
        CFBundleName: MeetingFly
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        # Menu-bar-only app: no Dock icon, no app menu bar of its own.
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSCalendarsUsageDescription: "MeetingFly reads your calendar so it can fly a reminder across your screen a few minutes before each meeting. Your calendar data stays on this Mac and is never sent anywhere."
        NSCalendarsFullAccessUsageDescription: "MeetingFly reads your calendar so it can fly a reminder across your screen a few minutes before each meeting. Your calendar data stays on this Mac and is never sent anywhere."
    entitlements:
      path: MeetingFly/Resources/MeetingFly.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingfly.app
        PRODUCT_NAME: MeetingFly
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
      gatherCoverageData: false
